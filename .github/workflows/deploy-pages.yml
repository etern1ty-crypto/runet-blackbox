name: deploy pages
on:
  push:
    branches: [master, main]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  workflow_run:
    workflows: ["import measurement report"]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Always build the trusted default branch, never code supplied by an issue.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run check
      - run: npm run aggregate
      - run: npm run build:web
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/web
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
